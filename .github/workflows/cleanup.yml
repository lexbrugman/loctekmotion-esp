name: Cleanup

# firmware.yml creates per-branch releases ("<branch>-latest" OTA channels and
# "<branch>-<timestamp>-<sha>" archives). "delete" prunes a branch's releases
# when the branch is deleted; "release" removes the tag GitHub leaves behind
# when a release is deleted by hand. Deletions made here run under
# GITHUB_TOKEN, which never triggers other runs, so the jobs can't overlap.
# Both triggers only fire from the workflow file on the default branch.
on:
  delete:
  release:
    types: [deleted]

permissions:
  contents: write

jobs:
  prune-releases:
    name: Prune releases of deleted branch
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    # Same group as firmware.yml uses for this branch, so pruning waits for an
    # in-flight build instead of racing its publish job.
    concurrency:
      group: firmware-refs/heads/${{ github.event.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete the branch's releases and their tags
        env:
          DELETED_BRANCH: ${{ github.event.ref }}
        run: |
          gh release list --limit 1000 --json tagName -q '.[].tagName' --repo "$GITHUB_REPOSITORY" |
          while read -r tag; do
            # Only CI-created tags (see above); hand-made ones like "v1.0" are
            # left alone. Branch names are sanitized as in firmware.yml (slashes
            # become dashes).
            [[ "$tag" =~ ^(.+)-latest$ ]] ||
              [[ "$tag" =~ ^(.+)-[0-9]{8}-[0-9]{6}-[0-9a-f]{7,40}$ ]] ||
              continue
            [ "${BASH_REMATCH[1]}" = "${DELETED_BRANCH//\//-}" ] || continue
            echo "Deleting release + tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
          done

  prune-tags:
    name: Prune tag of deleted release
    if: github.event_name == 'release' && github.event.action == 'deleted'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete the deleted release's tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Only CI-created tags; hand-made ones like "v1.0" are left alone.
          [[ "$TAG" =~ ^(.+)-([0-9a-f]{7,40}|latest)$ ]] || exit 0
          # A release may exist again for this tag by the time we run (e.g.
          # a re-run of a default-branch build deletes and immediately
          # recreates that commit's archive release) — leave such tags alone.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists again for $TAG; leaving tag in place"
            exit 0
          fi
          echo "Deleting orphaned tag: $TAG"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || true
