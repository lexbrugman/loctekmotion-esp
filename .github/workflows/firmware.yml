name: Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded run must never finish last and replace a newer rolling release.
# Manual runs do not publish, so they get their own group and can neither
# cancel nor displace a push run. cleanup.yml joins the push group so pruning
# never races a build for the branch.
concurrency:
  group: firmware-${{ github.event_name == 'workflow_dispatch' && 'manual-' || '' }}${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (host)
    # A same-repo PR's head commit already gets a push run, whose checks the PR
    # shows too, so only PRs from forks need a run of their own. "build"
    # repeats this condition.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pio
        with:
          env: native

      - name: Run host-side unit tests
        run: pio test -e native

  build:
    name: Build firmware (${{ matrix.env }})
    needs: test
    # Same condition as "test".
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [d1_mini, esp32dev]
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pio
        with:
          env: ${{ matrix.env }}

      # Must match the channel "publish" creates, so a binary tracks the repo
      # and channel it was built from (FW_OTA_REPO/FW_OTA_CHANNEL in config.h).
      - name: Determine version and OTA channel
        id: ver
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "channel=${GITHUB_REF_NAME//\//-}-latest" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          PLATFORMIO_BUILD_FLAGS: >-
            -DFW_VERSION=${{ steps.ver.outputs.version }}
            -DFW_OTA_REPO=\"${{ github.repository }}\"
            -DFW_OTA_CHANNEL=\"${{ steps.ver.outputs.channel }}\"
        run: pio run -e ${{ matrix.env }}

      # firmware-<board>.bin (must match cfg::kFirmwareAsset) is the app image
      # OTA flashes; firmware-<board>-full.bin is flashable at 0x0 for a first
      # USB install (scripts/merge_full_image.py). version.txt is the shared
      # commit SHA.
      - name: Stage release assets
        run: |
          mkdir -p dist
          build=.pio/build/${{ matrix.env }}
          cp $build/firmware.bin dist/firmware-${{ matrix.env }}.bin
          cp $build/firmware-full.bin dist/firmware-${{ matrix.env }}-full.bin
          echo -n "${{ steps.ver.outputs.version }}" > dist/version.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}-${{ steps.ver.outputs.version }}
          path: dist/

  publish:
    name: Publish rolling release (OTA channel)
    if: github.event_name == 'push' && github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7

      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*-${{ needs.build.outputs.version }}
          path: dist
          merge-multiple: true

      - name: Publish "<branch>-latest" release
        run: scripts/publish_release.sh channel

      - name: Archive this build's release
        if: github.ref_name == github.event.repository.default_branch
        run: scripts/publish_release.sh archive
